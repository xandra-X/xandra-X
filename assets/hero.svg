<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Adrein — Digital experiences that move. UI/UX Designer and Full-Stack Developer.">
  <defs>
    <linearGradient id="grad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#f5d0fe"/>
    </linearGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobF" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="460" rx="24"/></clipPath>
  </defs>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .big  { font-size: 84px; font-weight: 900; letter-spacing: -4px; }
    @keyframes driftA { 0%,100% { transform: translate(0,0) } 50% { transform: translate(60px,30px) } }
    @keyframes driftB { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-70px,-20px) } }
    @keyframes rise   { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
    @keyframes shine  { from { transform: translateX(-400px) skewX(-20deg) } to { transform: translateX(1400px) skewX(-20deg) } }
    @keyframes blink  { 50% { opacity: 0 } }
    @keyframes role   { 0%,2% { opacity: 0 } 5%,30% { opacity: 1 } 33%,100% { opacity: 0 } }
    @keyframes pulse  { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .a { animation: driftA 14s ease-in-out infinite; }
    .b { animation: driftB 17s ease-in-out infinite; }
    .l1 { animation: rise .8s ease-out both .1s; }
    .l2 { animation: rise .8s ease-out both .3s; }
    .l3 { animation: rise .8s ease-out both .5s; }
    .l4 { animation: rise .8s ease-out both .8s; }
    .shine { animation: shine 6s linear infinite 1.5s; }
    .caret { animation: blink 1s steps(1) infinite; }
    .r { opacity: 0; animation: role 9s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .r1 { opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#03040a"/>
    <rect width="1200" height="460" fill="url(#grid)"/>
    <ellipse class="a" cx="260" cy="120" rx="420" ry="300" fill="url(#blobC)"/>
    <ellipse class="b" cx="980" cy="380" rx="460" ry="320" fill="url(#blobF)"/>

    <!-- top bar -->
    <g class="sans l1">
      <circle cx="64" cy="58" r="5" fill="#67e8f9" class="dot"/>
      <text x="80" y="63" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="4">ADREIN</text>
      <text x="160" y="63" fill="#ffffff" fill-opacity=".45" font-size="13">creative developer</text>
      <rect x="954" y="38" width="190" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="976" cy="57" r="4" fill="#4ade80" class="dot"/>
      <text x="990" y="62" fill="#ffffff" fill-opacity=".8" font-size="13" font-weight="600">Open for freelance</text>
    </g>

    <!-- headline -->
    <g class="sans big">
      <text x="60" y="190" fill="#ffffff" class="l2">Digital</text>
      <text x="60" y="278" fill="url(#grad)" class="l3">experiences</text>
      <text x="60" y="366" fill="#ffffff" class="l4">that move.</text>
    </g>
    <rect class="shine" x="0" y="110" width="90" height="280" fill="#ffffff" fill-opacity=".025"/>

    <!-- rotating role -->
    <g class="mono" font-size="17" fill="#cffafe" fill-opacity=".8">
      <text x="62" y="416" fill="#67e8f9">&gt;</text>
      <text x="84" y="416" class="r r1">UI/UX Designer · Figma · Motion</text>
      <text x="84" y="416" class="r r2">Full-Stack Developer · React · Node.js</text>
      <text x="84" y="416" class="r r3">AI Automation · Bots · Workflows</text>
      <rect x="470" y="402" width="10" height="18" fill="#67e8f9" class="caret"/>
    </g>

    <!-- code card -->
    <g transform="translate(800 150)"><g class="l4">
      <rect width="340" height="196" rx="18" fill="#0b0d18" fill-opacity=".85" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="24" cy="24" r="5" fill="#ff5f57"/><circle cx="42" cy="24" r="5" fill="#febc2e"/><circle cx="60" cy="24" r="5" fill="#28c840"/>
      <text x="316" y="29" text-anchor="end" class="mono" font-size="11" fill="#ffffff" fill-opacity=".35">adrein.ts</text>
      <g class="mono" font-size="14">
        <text x="24" y="70"><tspan fill="#f0abfc">const</tspan><tspan fill="#ffffff"> idea = </tspan><tspan fill="#67e8f9">design</tspan><tspan fill="#ffffff">();</tspan></text>
        <text x="24" y="96"><tspan fill="#f0abfc">const</tspan><tspan fill="#ffffff"> app  = </tspan><tspan fill="#67e8f9">build</tspan><tspan fill="#ffffff">(idea);</tspan></text>
        <text x="24" y="122"><tspan fill="#67e8f9">ship</tspan><tspan fill="#ffffff">(app);</tspan></text>
        <text x="24" y="156" fill="#ffffff" fill-opacity=".35">// UX × Motion × Engineering</text>
      </g>
      <rect x="24" y="172" width="292" height="4" rx="2" fill="#ffffff" fill-opacity=".08"/>
      <rect x="24" y="172" width="292" height="4" rx="2" fill="url(#grad)">
        <animate attributeName="width" values="0;292;292" keyTimes="0;.7;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g></g>

    <rect width="1200" height="460" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
