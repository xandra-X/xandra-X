<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Let's build something people remember.">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#f5d0fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".28"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="1200" height="220" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @keyframes breathe { 0%,100% { opacity: .6 } 50% { opacity: 1 } }
    .glow { animation: breathe 5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="220" fill="#03040a"/>
    <ellipse class="glow" cx="600" cy="220" rx="560" ry="200" fill="url(#glow)"/>
    <text x="600" y="78" text-anchor="middle" fill="#ffffff" fill-opacity=".45" font-size="13" font-weight="700" letter-spacing="5">CONTACT</text>
    <text x="600" y="132" text-anchor="middle" font-size="44" font-weight="900" letter-spacing="-2"><tspan fill="#ffffff">Let’s build something </tspan><tspan fill="url(#g)">people remember.</tspan></text>
    <text x="600" y="176" text-anchor="middle" fill="#ffffff" fill-opacity=".55" font-size="16">adrein.dev@gmail.com  ·  adrein.dev</text>
    <rect width="1200" height="220" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
